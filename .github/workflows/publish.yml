name: Publish beer site

# Runs when beers.csv is pushed (from the GitHub mobile app), or manually.
on:
  push:
    branches: [main]
    paths: ['beers.csv']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Process incoming photos and rebuild the manifest
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUDFRONT_URL: ${{ secrets.CLOUDFRONT_URL }}
        run: python scripts/beer_sync.py process-incoming
        # process-incoming uploads the rebuilt manifest straight to S3/CloudFront,
        # which is what the site reads. manifest.json is not tracked, so there is
        # nothing to commit back.
