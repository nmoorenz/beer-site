<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Beer Necessities — Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <style>
    .chart-controls { margin: 24px 0 18px; }
    .chart-title { font-family: "Fraunces", serif; font-weight: 600; font-size: 20px; margin: 0 0 4px; }
    .chart-sub { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; }
    .chart-sub:empty { display: none; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .bar { fill: var(--amber); }
    .bar:hover { fill: var(--amber-deep); }
    .axis text { fill: var(--ink-soft); font-size: 11px; }
    .axis path, .axis line { stroke: var(--line); }
    .bar-label { fill: var(--ink-soft); font-size: 11px; }
    .charts-note { color: var(--ink-soft); font-size: 13px; margin: 0; }
    .others { font-size: 13px; color: var(--ink-soft); line-height: 1.7; margin: 18px 0 0; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🍺</span>
        <h1>Beer Necessities — Charts</h1>
      </div>
    </div>
  </header>

  <main class="wrap">
    <p class="charts-note" id="summary">Loading…</p>
    <div class="chart-controls">
      <label class="sr-only" for="chart-picker">Choose a chart</label>
      <select id="chart-picker"></select>
    </div>
    <h2 class="chart-title" id="chart-title"></h2>
    <p class="chart-sub" id="chart-sub"></p>
    <div class="chart" id="chart"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="config.js"></script>
  <script src="charts.js"></script>
</body>
</html>
